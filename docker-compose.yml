version: '3.8'

services:
  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoryloop-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOSTNAME=0.0.0.0
    networks:
      - app-network
    # Optional: Health check (uncomment if needed)
    # healthcheck:
    #   test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: memoryloop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

